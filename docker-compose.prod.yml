services:

  # ----------------------------------------------------------------
  # MariaDB — same version as the live server and local development
  # ----------------------------------------------------------------
  mariadb:
    image: mariadb:11.8
    container_name: game-db-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER:     ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # No root login needed by the app; a random one is printed once to the log
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Laravel Backend (PHP-FPM, Code im Image gebacken)
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: game-db-backend
    restart: unless-stopped
    environment: &backend-env
      APP_NAME:    "${APP_NAME}"
      APP_ENV:     production
      APP_DEBUG:   "false"
      APP_KEY:     "${APP_KEY}"
      APP_URL:     "https://${DOMAIN}"
      FRONTEND_URL: "https://${DOMAIN}"

      APP_LOCALE:          de
      APP_FALLBACK_LOCALE: de

      DB_CONNECTION: mysql
      DB_HOST:       mariadb
      DB_PORT:       3306
      DB_DATABASE:   "${DB_DATABASE}"
      DB_USERNAME:   "${DB_USERNAME}"
      DB_PASSWORD:   "${DB_PASSWORD}"

      SESSION_DRIVER:   cookie
      SESSION_LIFETIME: 120
      SESSION_DOMAIN:   ".${DOMAIN}"

      SANCTUM_STATEFUL_DOMAINS: "${DOMAIN}"

      QUEUE_CONNECTION: database
      CACHE_STORE:      database
      FILESYSTEM_DISK:  local

      LOG_CHANNEL: stack
      LOG_LEVEL:   error

      MAIL_MAILER:       smtp
      MAIL_HOST:         "${MAIL_HOST}"
      MAIL_PORT:         "${MAIL_PORT}"
      MAIL_USERNAME:     "${MAIL_USERNAME}"
      MAIL_PASSWORD:     "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION:   ssl
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME:    "${APP_NAME}"

      # Payments (token packages, membership fee)
      MOLLIE_KEY:         "${MOLLIE_KEY}"
      MOLLIE_WEBHOOK_URL: "https://${DOMAIN}/api/webhooks/mollie"
    volumes:
      - backend_storage:/var/www/backend/storage
      - backend_cache:/var/www/backend/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy

  # ----------------------------------------------------------------
  # Scheduler (führt Laravel's Cron-Scheduler aus — u.a. loans:mark-overdue,
  # loans:send-due-soon-reminders, members:send-renewal-reminders, siehe
  # routes/console.php. Ohne diesen Container laufen die dort definierten
  # Schedule::command()-Jobs nie, da nichts `schedule:run` aufruft.)
  # ----------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: game-db-scheduler
    restart: unless-stopped
    entrypoint: []
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    environment: *backend-env
    volumes:
      - backend_storage:/var/www/backend/storage
      - backend_cache:/var/www/backend/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy

  # ----------------------------------------------------------------
  # Queue-Worker: verschickt die Mails, die in die Warteschlange gestellt
  # werden (Newsletter, Benachrichtigungen). Ohne ihn bleiben sie liegen.
  # ----------------------------------------------------------------
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: game-db-queue-worker
    restart: unless-stopped
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    environment: *backend-env
    volumes:
      - backend_storage:/var/www/backend/storage
      - backend_cache:/var/www/backend/bootstrap/cache
    depends_on:
      mariadb:
        condition: service_healthy

  # ----------------------------------------------------------------
  # Nginx (SSL-Termination + Reverse Proxy + Frontend)
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: game-db-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./docker/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend-dist:/var/www/frontend:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - backend

  # ----------------------------------------------------------------
  # Certbot (SSL-Zertifikate via Let's Encrypt)
  # ----------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: game-db-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  mariadb_data:
  backend_storage:
  backend_cache:
